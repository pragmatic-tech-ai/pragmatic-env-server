# Illustrative gateway + worker split for local testing. Supply mTLS PEM files (./tls) and a master key
# (./master.key) out of band -- never commit them. Run: docker compose -f docker-compose.cluster.yml up
# Images: the released pragmatic-env-server (workers) and pragmatic-env-gateway (gateway); override the tags with
# PRAGMATIC_ENV_SERVER_TAG / PRAGMATIC_ENV_GATEWAY_TAG.
services:
  # The workers' one shared database (A5): every worker of the deployment stores in it (compose-README.md, step 2).
  pragmatic-postgres:
    image: ghcr.io/pragmatic-tech-ai/pragmatic-postgres:${PRAGMATIC_POSTGRES_TAG:-0.1.0}
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    volumes:
      - pragmatic-postgres-data:/var/lib/postgresql/data
      - ./postgres:/etc/pragmatic-postgres:ro
      - ./postgres-secrets/pragmatic-postgres:/run/secrets/pragmatic-postgres:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  worker1:
    image: ghcr.io/pragmatic-tech-ai/pragmatic-env-server:${PRAGMATIC_ENV_SERVER_TAG:-0.1.0}
    command: ["node", "server/dist/bin/pragmatic-workerd.js"]
    environment:
      PRAGMATIC_BASE_DIR: /data
      PRAGMATIC_PORT: "8443"
      PRAGMATIC_HEALTH_PORT: "8081"
      PRAGMATIC_ENVIRONMENTS_FILE: /cfg/environments.json
      PRAGMATIC_MASTER_KEY_FILE: /run/secrets/master_key
      PRAGMATIC_REDIS_URL: redis://redis:6379
      PRAGMATIC_ENV_SERVER_DATABASE_URL_FILE: /run/secrets/pragmatic-env-server/database-url
      PRAGMATIC_WORKER_ADVERTISE_HOST: worker1
      PRAGMATIC_WORKER_ADVERTISE_PORT: "8443"
      PRAGMATIC_TLS_CERT_FILE: /run/secrets/tls/server.pem
      PRAGMATIC_TLS_KEY_FILE: /run/secrets/tls/server.key
      PRAGMATIC_TLS_CA_FILE: /run/secrets/tls/ca.pem
    volumes:
      - ./environments.example.json:/cfg/environments.json:ro
      - ./master.key:/run/secrets/master_key:ro
      - ./tls:/run/secrets/tls:ro
      - ./postgres-secrets/database-url:/run/secrets/pragmatic-env-server/database-url:ro
    depends_on:
      - redis
      - pragmatic-postgres
  worker2:
    image: ghcr.io/pragmatic-tech-ai/pragmatic-env-server:${PRAGMATIC_ENV_SERVER_TAG:-0.1.0}
    command: ["node", "server/dist/bin/pragmatic-workerd.js"]
    environment:
      PRAGMATIC_BASE_DIR: /data
      PRAGMATIC_PORT: "8443"
      PRAGMATIC_HEALTH_PORT: "8081"
      PRAGMATIC_ENVIRONMENTS_FILE: /cfg/environments.json
      PRAGMATIC_MASTER_KEY_FILE: /run/secrets/master_key
      PRAGMATIC_REDIS_URL: redis://redis:6379
      PRAGMATIC_ENV_SERVER_DATABASE_URL_FILE: /run/secrets/pragmatic-env-server/database-url
      PRAGMATIC_WORKER_ADVERTISE_HOST: worker2
      PRAGMATIC_WORKER_ADVERTISE_PORT: "8443"
      PRAGMATIC_TLS_CERT_FILE: /run/secrets/tls/server.pem
      PRAGMATIC_TLS_KEY_FILE: /run/secrets/tls/server.key
      PRAGMATIC_TLS_CA_FILE: /run/secrets/tls/ca.pem
    volumes:
      - ./environments.example.json:/cfg/environments.json:ro
      - ./master.key:/run/secrets/master_key:ro
      - ./tls:/run/secrets/tls:ro
      - ./postgres-secrets/database-url:/run/secrets/pragmatic-env-server/database-url:ro
    depends_on:
      - redis
      - pragmatic-postgres
  gateway:
    # The gateway is its own image (pragmatic-env-gateway); its entrypoint is pragmatic-gatewayd.
    image: ghcr.io/pragmatic-tech-ai/pragmatic-env-gateway:${PRAGMATIC_ENV_GATEWAY_TAG:-0.1.0}
    ports:
      - "8080:8080"
    environment:
      PRAGMATIC_PORT: "8080"
      PRAGMATIC_REDIS_URL: redis://redis:6379
      # The gateway validates every worker's TLS cert against this name (not the connect host), so the
      # worker server cert's SAN must equal it. The fixtures' server.pem has an IP SAN of 127.0.0.1.
      PRAGMATIC_WORKER_SERVERNAME: 127.0.0.1
      PRAGMATIC_TLS_CERT_FILE: /run/secrets/tls/client.pem
      PRAGMATIC_TLS_KEY_FILE: /run/secrets/tls/client.key
      PRAGMATIC_TLS_CA_FILE: /run/secrets/tls/ca.pem
    volumes:
      - ./tls:/run/secrets/tls:ro
    depends_on:
      - redis
volumes:
  pragmatic-postgres-data:
